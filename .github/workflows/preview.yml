name: preview
# Every pull request gets its own Worker (floppy-clash-pr-<n>) with its own room relay, redeployed on
# each push and deleted when the PR closes. Same-repo PRs only: forks do not get the deploy secret.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WORKER_NAME: floppy-clash-pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy preview Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name ${{ env.WORKER_NAME }} --var ENVIRONMENT:preview
      - name: Post the preview URL on the PR
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- floppy-clash-preview -->';
            const url = process.env.DEPLOYMENT_URL || `https://${process.env.WORKER_NAME}.workers.dev`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              '### Preview deployment',
              '',
              `**${url}**`,
              '',
              `Worker \`${process.env.WORKER_NAME}\` · commit \`${sha}\` · redeployed on every push, deleted when this PR closes.`,
              'Online rooms on a preview are separate from production: everyone in a match must use the same link.',
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: delete --name ${{ env.WORKER_NAME }} --force
      - name: Note the teardown on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- floppy-clash-preview -->';
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            const body = `${marker}\n### Preview deployment\n\nWorker \`${process.env.WORKER_NAME}\` was deleted when this PR closed.`;
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
