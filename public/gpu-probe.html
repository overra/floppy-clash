<!doctype html>
<meta charset="utf-8" />
<title>WebGPU map probe</title>
<pre id="out">probing…</pre>
<script type="module">
  const out = document.getElementById('out');
  const report = (v) => {
    window.__gpuProbe = v;
    out.textContent = JSON.stringify(v, null, 2);
  };
  try {
    const gpu = navigator.gpu;
    if (!gpu) {
      report({ hasGpu: false, rawMap: 'no-navigator-gpu', texMap: '' });
    } else {
      const adapter = await gpu.requestAdapter();
      if (!adapter) {
        report({ hasGpu: true, rawMap: 'no-adapter', texMap: '' });
      } else {
        const device = await adapter.requestDevice();
        const src = device.createBuffer({
          size: 256,
          usage: GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
        });
        const dst = device.createBuffer({
          size: 256,
          usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
        });
        device.queue.writeBuffer(src, 0, new Uint8Array([9, 8, 7, 6]));
        const enc = device.createCommandEncoder();
        enc.copyBufferToBuffer(src, 0, dst, 0, 256);
        device.queue.submit([enc.finish()]);
        let rawMap = '';
        try {
          await dst.mapAsync(GPUMapMode.READ);
          const v = new Uint8Array(dst.getMappedRange());
          rawMap = `ok:${v[0]}`;
          dst.unmap();
        } catch (e) {
          rawMap = `fail:${e instanceof Error ? e.message : String(e)}`;
        }
        let texMap = '';
        try {
          const tex = device.createTexture({
            size: { width: 4, height: 4 },
            format: 'rgba8unorm',
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
          });
          const staging = device.createBuffer({
            size: 256,
            usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
          });
          const enc2 = device.createCommandEncoder();
          const pass = enc2.beginRenderPass({
            colorAttachments: [
              {
                view: tex.createView(),
                loadOp: 'clear',
                storeOp: 'store',
                clearValue: { r: 1, g: 0, b: 0.25, a: 1 },
              },
            ],
          });
          pass.end();
          enc2.copyTextureToBuffer(
            { texture: tex },
            { buffer: staging, bytesPerRow: 256 },
            { width: 4, height: 4 },
          );
          device.queue.submit([enc2.finish()]);
          await staging.mapAsync(GPUMapMode.READ);
          const px = new Uint8Array(staging.getMappedRange());
          texMap = `ok:${px[0]},${px[1]},${px[2]},${px[3]}`;
          staging.unmap();
        } catch (e) {
          texMap = `fail:${e instanceof Error ? e.message : String(e)}`;
        }
        report({
          hasGpu: true,
          mapRead: GPUBufferUsage.MAP_READ,
          mapMode: GPUMapMode.READ,
          copySrc: GPUTextureUsage.COPY_SRC,
          rawMap,
          texMap,
        });
      }
    }
  } catch (e) {
    report({ hasGpu: !!navigator.gpu, rawMap: `outer:${e}`, texMap: '' });
  }
</script>
