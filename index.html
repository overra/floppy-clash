<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111318" />
    <title>Floppy Clash</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111318;
        --panel: #1b1e27;
        --ink: #f4f1ea;
        --muted: #9aa3b2;
        --accent: #f2c14e;
        --p0: #f2c14e;
        --p1: #4c8dff;
        --p2: #e85d4c;
        --p3: #3dcf7a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas.game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud,
      #menus {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #menus > * {
        pointer-events: auto;
      }
      .notice {
        position: absolute;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" class="game"></canvas>
      <div id="hud"></div>
      <div id="menus"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
